name: Check upstream France_RFE updates

on:
    schedule:
        - cron: "0 6 1 * *"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    check-upstream:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Get latest upstream release tag
              id: upstream
              uses: actions/github-script@v9
              with:
                  script: |
                      const release = await github.rest.repos.getLatestRelease({
                        owner: 'fnfempe',
                        repo: 'France_RFE'
                      });
                      core.setOutput('tag', release.data.tag_name);

            - name: Read tracked upstream version
              id: tracked
              run: |
                  if [ -f .github/upstream-france-rfe-version.txt ]; then
                    echo "tag=$(cat .github/upstream-france-rfe-version.txt)" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Sync upstream files
              if: steps.upstream.outputs.tag != steps.tracked.outputs.tag
              run: |
                  set -euo pipefail
                  TAG="${{ steps.upstream.outputs.tag }}"
                  git remote add upstream https://github.com/fnfempe/France_RFE.git
                  git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/${TAG}"
                  rm -rf resources
                  mkdir -p resources docs
                  find docs -mindepth 1 -maxdepth 1 -name 'Z*' -exec rm -rf {} +
                  git checkout "refs/tags/${TAG}" -- FNFE_RFE_INVOICE
                  for path in FNFE_RFE_INVOICE/*; do
                    name="$(basename "${path}")"
                    if [[ "${name}" == Z* ]]; then
                      mv "${path}" docs/
                    else
                      mv "${path}" resources/
                    fi
                  done
                  rmdir FNFE_RFE_INVOICE
                  echo "${TAG}" > .github/upstream-france-rfe-version.txt

            - name: Create pull request
              if: steps.upstream.outputs.tag != steps.tracked.outputs.tag
              uses: peter-evans/create-pull-request@v8
              with:
                  commit-message: "chore: sync France_RFE upstream to ${{ steps.upstream.outputs.tag }}"
                  branch: "chore/update-france-rfe-upstream"
                  delete-branch: true
                  title: "chore: sync France_RFE upstream to ${{ steps.upstream.outputs.tag }}"
                  body: |
                      Automated monthly update from `fnfempe/France_RFE`.

                      - Upstream release detected: `${{ steps.upstream.outputs.tag }}`
                      - Synced directories: `resources` and `docs` (`Z*` only)
                      - Updated tracker: `.github/upstream-france-rfe-version.txt`
